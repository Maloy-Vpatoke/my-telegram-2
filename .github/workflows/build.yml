name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

   
      - name: Install SDK platform, NDK and CMake
        run: |
         SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
         yes | $SDKM --licenses > /dev/null || true
         $SDKM "platforms;android-33" "build-tools;33.0.0" "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Install Ninja and Go
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build golang yasm nasm

      - name: Create API_KEYS from secrets
        run: |
          echo "APP_ID=${{ secrets.APP_ID }}" > API_KEYS
          echo "APP_HASH=${{ secrets.APP_HASH }}" >> API_KEYS

      - name: Build native dependencies (FFmpeg, BoringSSL, libvpx)
        working-directory: TMessagesProj/jni
        run: |
          export NDK="$ANDROID_SDK_ROOT/ndk/21.4.7075529"
          export NINJA_PATH="$(which ninja)"
          chmod +x *.sh
          ./build_ffmpeg_clang.sh
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh
          ./build_boringssl.sh
          if [ -f build_libvpx_clang.sh ]; then ./build_libvpx_clang.sh; fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"
